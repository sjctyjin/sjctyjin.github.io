<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 機器人模擬展示大廳</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: white;
            border: 1px solid #444;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
        }
        .card p {
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>🦾 機器人與 AGV 模擬展示大廳</h1>
    <p>請選擇您要查看的 3D 模型：</p>

    <div class="grid-container">
        <a href="./dual_arm_nocar.html" class="card">
            <h2>雙臂機器人 (無車底盤)</h2>
            <p>包含基礎的雙臂 URDF 載入與關節控制展示</p>
        </a>

        <a href="./dual_arm_humanity.html" class="card">
            <h2>仿人型雙臂機器人</h2>
            <p>展示具有擬人化結構的雙臂模型</p>
        </a>

        <a href="./agv_dispatch_system.html" class="card">
            <h2>AGV 派車系統介面</h2>
            <p>無人搬運車的調度與路徑模擬</p>
        </a>

        <a href="./crx10ial.html" class="card">
            <h2>FANUC CRX-10iA/L</h2>
            <p>工業級協作機械手臂模型展示</p>
        </a>
        
        <a href="./piper.html" class="card">
            <h2>Piper 機械手臂</h2>
            <p>Piper 模型的 3D 渲染與關節測試</p>
        </a>
    </div>

</body>
</html>
