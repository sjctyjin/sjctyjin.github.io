<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>360 Panorama Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js"
      }
    }
  </script>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';

    const viewer = new Viewer({
      container: document.querySelector('#viewer'),

      // 換成你的 360 全景圖
      panorama: './pano.jpg',

      // 啟用手指拖曳 / 滑鼠拖曳
      mousemove: true,

      // 啟用滑鼠滾輪縮放
      mousewheel: true,

      // 手機單指拖曳即可旋轉，不強制雙指
      touchmoveTwoFingers: false,

      // 縮放範圍
      // 數字越小 = 放越大
      minFov: 30,
      maxFov: 100,

      // 初始縮放程度，0~100
      defaultZoomLvl: 30,

      // 拖曳速度
      moveSpeed: 1.2,

      // 縮放速度
      zoomSpeed: 1.2,

      // 慣性，想要拖曳後滑順一點就保留
      moveInertia: 0.8,

      // 下方工具列
      navbar: [
        'zoom',
        'fullscreen'
      ],
    });
  </script>
</body>
</html>
